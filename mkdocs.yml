site_name: Conductor
site_description: Walks a procedure across a beamline, one step at a time.
repo_url: https://github.com/open-cora/conductor
repo_name: open-cora/conductor
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/theme.css

extra_javascript:
  - javascripts/hero-fade.js

extra:
  hero:
    masthead: Conductor
    tagline: Ariadne, whose thread led the way through the labyrinth
    image: assets/hero-conductor-3600.webp
    srcset: "assets/hero-conductor-1200.webp 1200w, assets/hero-conductor-2400.webp 2400w, assets/hero-conductor-3600.webp 3600w"
    image_alt: >-
      Theseus and Ariadne, by Angelica Kauffmann: Ariadne leans forward to offer Theseus the red thread that will guide him through the labyrinth.
    credit: Angelica Kauffmann · Theseus and Ariadne · public domain
    credit_url: https://artvee.com/dl/theseus-and-ariadne-2/

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
